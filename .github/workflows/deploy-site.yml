# Deploy the site to GitHub Pages: the tracked static landing page (site/) at
# the root, plus the mkdocs docs built into site/docs/ (served at /docs).
# Settings → Pages → Source: "GitHub Actions"
name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs/**"
      # Component trees: their READMEs are rendered into the docs, and bumping a
      # submodule pointer changes the tree too (the gitlink path is the dir itself).
      - "services/**"
      - "jobs/**"
      - "platform/**"
      - "infrastructure/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # docs may source content from service submodules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs/requirements.txt
      - name: Build docs into site/docs
        run: |
          pip install -r mkdocs/requirements.txt
          # --strict: a warning (dead link, page missing from nav) fails the build.
          mkdocs build --strict -f mkdocs.yml
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
