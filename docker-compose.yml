# Root stack aggregator: platform systems + included slices.
# Include: `- platform/airflow/compose.yaml` — orchestration + its metadata DB
#          `- platform/kafka/compose.yaml`     — cluster systems (Kafka, always-on)
#          `- services/compose.yaml`            — deployable services slice
# Slices are also runnable standalone:
#   cd services && docker compose up
#   cd platform/airflow && docker compose up
# What is left here is what is not a platform system: the Flink session
# cluster and the Spark master. Conventions: no `version:` key (Compose ≥2.20),
# project name fixed so included and standalone runs share the same identity.
# See README.

name: hyperdata-platform

include:
  - platform/airflow/compose.yaml
  - platform/kafka/compose.yaml
  - services/compose.yaml

services:
  # --- Stream Processing Platform ---
  flink-jobmanager:
    build:
      context: ./platform/flink-cluster
    command: jobmanager
    ports:
      - "8081:8081"

  flink-taskmanager:
    build:
      context: ./platform/flink-cluster
    command: taskmanager
    depends_on:
      - flink-jobmanager

  # --- Batch Execution Processing ---
  spark-master:
    build:
      context: ./jobs/spark
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "9090:8080"
    volumes:
      - ./jobs/spark:/opt/spark/workloads