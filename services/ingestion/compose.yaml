# Ingestion-layer stack — self-contained, also included by the root compose.
# Standalone:  cd services/ingestion && docker compose up
# Included:    root `docker compose up` merges this into project hyperdata-platform.
# Rule: infra is defined by the first layer that needs it and promoted to
# platform/ when a second layer consumes it (see README.md).

name: hyperdata-platform

services:
  # --- Messaging (Kafka, KRaft mode — no ZooKeeper) ---
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"                       # host tools; in-network is kafka:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,LOCAL://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,LOCAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS: "true"     # dev convenience; disable in prod
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:                               # one-shot topic bootstrap
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic hyperliquid.node-files \
          --partitions 6 \
          --replication-factor 1

  # --- Ingestion workloads ---
  hyperdata-node:
    # Live node OR replay tap. TODO: build hyperdata-node image; for now a
    # placeholder that keeps the shared output volume mounted for replay fixtures.
    image: bash:5.2
    command: ["sleep", "infinity"]
    volumes:
      - node-outputs:/home/hluser/hl/data
    profiles: [node]

  hyperliquid-node-sidecar:
    build:
      context: ./hyperliquid-node-sidecar
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      WATCH_DIR: /watch
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: hyperliquid.node-files
    volumes:
      - node-outputs:/watch
    profiles: [node]

  # --- Catalog & dev storage (Parquet/Iceberg layer) ---
  iceberg-catalog:
    # REST catalog (Nessie-class) — one catalog for Flink/Spark/dbt.
    # TODO: pick implementation (Nessie / Polaris / Gravitino) + image.
    image: ghcr.io/projectnessie/nessie:0.104.1
    environment:
      QUARKUS_PROFILE: prod
    ports:
      - "19120:19120"
    volumes:
      - catalog-data:/storage
    profiles: [warehouse]

  minio:
    # S3-compatible local storage standing in for S3/GCS in dev.
    image: minio/minio:RELEASE.2025-04-22T22-20-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hyperdata
      MINIO_ROOT_PASSWORD: hyperdata-dev
    ports:
      - "9000:9000"                        # S3 API (Flink/Spark iceberg sink)
      - "9001:9001"                        # console
    volumes:
      - warehouse-data:/data
    profiles: [warehouse]

volumes:
  node-outputs:
  kafka-data:
  catalog-data:
  warehouse-data: